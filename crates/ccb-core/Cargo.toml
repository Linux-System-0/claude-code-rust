[package]
name = "ccb-core"
description = "Message model, query loop, and QueryEngine orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ccb-api.workspace = true
protocol-anthropic = { workspace = true, optional = true }
protocol-openai = { workspace = true, optional = true }
ccb-tools.workspace = true
ccb-session.workspace = true

# Only two protocol features exist by design (Plan/01-trim-scope.md §2).
# No other `feature()`/provider flags are provided; unlisted providers simply
# do not compile. At least one of `anthropic` / `openai` must be enabled.
[features]
default = ["anthropic", "openai"]
anthropic = ["dep:protocol-anthropic"]
openai = ["dep:protocol-openai"]
