name: CI

on:
  push:
    branches: [main, feature/rust]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the network/registry behaviour stable across the matrix.
  CARGO_NET_RETRY: 5
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  features:
    name: protocol feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: anthropic only
        run: cargo build -p ccb-cli --no-default-features --features anthropic --locked
      - name: openai only
        run: cargo build -p ccb-cli --no-default-features --features openai --locked
      - name: both protocols
        run: cargo build -p ccb-cli --all-features --locked
      - name: no protocol must fail
        shell: bash
        run: |
          if cargo build -p ccb-cli --no-default-features --locked 2>build-error.log; then
            echo "::error::expected the build to fail when no protocol is selected"
            exit 1
          fi
          grep -q "requires at least one protocol feature" build-error.log
